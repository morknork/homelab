- name: Ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present

- name: Create ansible group
  ansible.builtin.group:
    name: ansible
    state: present

- name: Create ansible service account
  ansible.builtin.user:
    name: "{{ ansible_service_account }}"
    group: ansible
    password_lock: true
    state: present
    shell: /bin/bash

- name: Add SSH key to authorized users
  ansible.posix.authorized_key:
    user: "{{ ansible_service_account }}"
    state: present
    key: "{{ ansible_service_ssh_public_key }}"

- name: Add ansible group to passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ansible
    content: "%ansible ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"
