arr_dir: /opt/arr
arr_config_dir: "{{ arr_dir }}/config-apps"
arr_owner: madmin            # owns the compose file and .env
arr_puid: 666                # linuxserver containers drop to this
arr_pgid: 666                # matches the host media group
arr_tz: Australia/Melbourne

# Bind source. Inside CT 200 the storage is mounted at /data by
# mp0 in the container config — NOT /mnt/data. That was the
# "Missing root folder" bug.
arr_media_path: /data

# qBittorrent runs in gluetun's netns, so this port is published on
# gluetun and WEBUI_PORT must match it exactly.
arr_qbt_webui_port: 8080

# Must contain the compose network's bridge subnet or the other
# containers can't reach the WebUI through gluetun's firewall.
arr_firewall_outbound_subnets: "172.16.0.0/12,10.0.0.0/24"

arr_vpn_provider: protonvpn
arr_vpn_server_countries: Netherlands
arr_vpn_port_forwarding: "on"
arr_vpn_port_forwarding_provider: protonvpn

# seerr's node process is uid 1000 and ignores PUID/PGID entirely.
arr_seerr_uid: 1000
arr_seerr_gid: 1000

# Config dirs owned by the media uid/gid.
arr_config_dirs:
  - { name: qbittorrent, owner: 666,  group: 666  }
  - { name: radarr,      owner: 666,  group: 666  }
  - { name: sonarr,      owner: 666,  group: 666  }
  - { name: prowlarr,    owner: 666,  group: 666  }
  
  # PUID/PGID. The numbers are the image's, not ours.
  - { name: seerr,       owner: 1000, group: 1000 }
  - { name: homarr,      owner: 1001, group: 1001 }

arr_ports:
  radarr: 7878
  sonarr: 8989
  prowlarr: 9696
  homarr: 7575
  seerr: 5055


