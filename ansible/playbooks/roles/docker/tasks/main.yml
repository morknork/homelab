# Debian install
- name: Check for unprivileged LXC
  ansible.builtin.assert:
    that: "ansible_facts['virtualization_type'] == 'lxc'"
    success_msg: "Host is an LXC: nesting=1 must be enabled if unprivileged"

- name: Ensure keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Fetch docker gpg key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644" 

- name: Add docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc

- name: Install docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure docker is running
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ user_admin_account_name }}"
    groups: docker
    append: true

- name: Install and configure docker_fw
  ansible.builtin.import_tasks: docker_fw.yml

- name: Flush handlers before dependent roles run
  ansible.builtin.meta: flush_handlers
