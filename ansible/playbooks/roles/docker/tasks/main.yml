# Debian install
- name: Check for unprivileged LXC
  ansible.builtin.assert:
    that: "ansible_facts['virtualization_type'] == 'lxc'"
    success_msg: "Host is an LXC: nesting=1 must be enabled if unprivileged"

- name: Add docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc

- name: Install and configure docker_fw
  ansible.builtin.import_tasks: docker_fw.yml

- name: Flush handlers before dependent roles run
  ansible.builtin.meta: flush_handlers
