- name: Universal baseline config
  hosts: all
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Fail loudly if this play matched nothing meaningful
      ansible.builtin.assert:
        that: ansible_play_hosts | length > 0
        fail_msg: "Only {{ ansible_play_hosts | length }} host(s) matched — check --limit"
      run_once: true
      tags: [always, base]
  roles:
    - base_common

- name: Kernel tuning
  hosts: vm,proxmox
  become: true
  roles:
    - role: kernel_tuning
      tags: [kernel]

- name: Server baseline
  hosts: proxmox,guests,!workstation
  become: true
  roles:
    - role: base_server
      tags: [server]

- name: Authentik
  hosts: authentik01
  become: true
  roles:
    - role: authentik
      tags: [authentik]

- name: Arr stack
  hosts: arr02
  become: true
  roles:
    - role: arr_stack
      tags: [arr]