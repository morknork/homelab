# ansible-playbook playbooks/bootstrap.yml -u madmin -K
- name: Bootstrap svc-ansible - first touch only
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Esnure Python is present
      ansible.builtin.raw: test -e /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      changed_when: false

    - name: Gather facts now that Python exists
      ansible.builtin.setup:

    - name: Import tasks from service_account
      ansible.builtin.import_role:
        name: base_common
        tasks_from: service_account.yml

- name: Extract ansible ssh private key from vault and store
  hosts: control
  become: true
  tasks:
    - name: Create .ssh/homelab
      ansible.builtin.file:
        path: /home/{{ user_admin_account_name }}/.ssh/homelab/
        state: directory
        mode: "0700"

    - name: Extract key into directory
      ansible.builtin.copy:
        content: "{{ vault_ansible_ssh_private_key }}"
        dest: ~/.ssh/homelab/id_ed25519
        mode: "0600"
